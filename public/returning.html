<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Returning guests · Valley View Chalet</title>
<meta name="description" content="Private access for returning guests of Valley View Chalet.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>

<header class="site-header">
  <a class="logo" href="/">Valley View Chalet</a>
  <nav class="site-nav" id="site-nav" aria-label="Main">
    <a href="/">The Chalet</a>
    <a href="/gallery.html">Gallery</a>
    <a href="/reviews.html">Reviews</a>
    <a href="/events.html">Events</a>
    <a href="/guide.html">Guide</a>
  </nav>
  <a class="btn btn--shadow" href="/book.html">Reserve</a>
  <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav"><svg viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M0 1h18M0 6h18M0 11h18"/></svg></button>
</header>

<div class="returning">
  <img src="/assets/img/aerial-night.webp" alt="The chalet lit up at night in the snow">
  <main>
    <form class="card-panel form" style="width: 100%; max-width: 520px; text-align: center;" method="POST" action="/api/returning-unlock" data-returning-gate>
      <p class="eyebrow">Welcome back</p>
      <h1 style="font-size: 52px;">It's good to see you again.</h1>
      <p class="card__text">Enter the code we shared with you to request dates directly with us.</p>
      <label class="input" style="text-align: left;">Access code
        <input type="text" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" required style="font-size: 18px; letter-spacing: .12em;">
      </label>
      <button class="btn" type="submit" style="min-height: 60px;">Continue</button>
      <p class="form-msg" role="alert"></p>
      <p class="muted" style="font-size: 13px;">No code? <a class="brass" href="/book.html">Book online instead</a></p>
    </form>
  </main>
</div>

<!-- Netlify Forms registration only (hidden). The real form is served privately at /returning/request after the code is verified. -->
<form name="returning-request" data-netlify="true" netlify-honeypot="company" hidden>
  <input name="arrive"><input name="depart"><input name="guests"><input name="name"><input name="email"><input name="phone"><input name="pet"><textarea name="message"></textarea><input name="company"><input name="verified">
</form>

<footer class="site-footer">
  <span class="logo">Valley View</span>
  <span>Lexington, New York · Superhosts · 12 years of hosting · <a href="/returning.html">Returning guests</a></span>
</footer>

<script src="/assets/js/site.js" defer></script>
</body>
</html>
